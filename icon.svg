<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FDF4EC"/>
      <stop offset="100%" stop-color="#FBE8DA"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="55%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="marieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="thomasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Fond Crème & Pêche Familial -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#F5D5C0" stroke-width="4" opacity="0.7"/>

  <!-- Soleil doux & nuage en arrière-plan -->
  <circle cx="390" cy="116" r="46" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="390" cy="116" r="58" fill="#FDE047" opacity="0.22"/>

  <!-- Cheminée mignonne avec petit cœur de fumée -->
  <rect x="338" y="114" width="36" height="58" rx="8" fill="#E11D48"/>
  <path d="M356 96 C348 88 338 88 338 78 C338 71 344 66 350 66 C353 66 355 68 356 70 C357 68 359 66 362 66 C368 66 374 71 374 78 C374 88 364 88 356 96 Z" fill="#FB7185" opacity="0.85"/>

  <!-- Corps de la maison-calendrier -->
  <g filter="url(#softShadow)">
    <rect x="86" y="190" width="340" height="252" rx="42" fill="#FFFFFF" stroke="#F3E5D8" stroke-width="5"/>
    <!-- Bandeau calendrier sous le toit -->
    <path d="M86 226 L426 226 L426 250 L86 250 Z" fill="#FFF5ED"/>
  </g>

  <!-- Toit chaleureux de la maison -->
  <g filter="url(#cardShadow)">
    <path d="M54 214 L236 74 C248 65 264 65 276 74 L458 214 C470 223 464 242 448 242 L64 242 C48 242 42 223 54 214 Z" fill="url(#roofGrad)"/>
    <!-- Cœur blanc au sommet du toit -->
    <path d="M256 178 C242 165 222 154 222 136 C222 124 231 115 243 115 C249 115 253 118 256 123 C259 118 263 115 269 115 C281 115 290 124 290 136 C290 154 270 165 256 178 Z" fill="#FFFFFF"/>
  </g>

  <!-- Silhouettes familiales : Marie (gauche), Thomas (droite), Émile (centre devant) -->
  <!-- Marie -->
  <g transform="translate(0, 4)">
    <path d="M132 374 C132 332 162 314 190 314 C218 314 248 332 248 374 Z" fill="url(#marieGrad)"/>
    <circle cx="190" cy="276" r="30" fill="#FDE6D8" stroke="url(#marieGrad)" stroke-width="6"/>
    <!-- Sourire doux Marie -->
    <circle cx="181" cy="273" r="3.2" fill="#831843"/>
    <circle cx="199" cy="273" r="3.2" fill="#831843"/>
    <path d="M182 284 Q190 291 198 284" fill="none" stroke="#831843" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Thomas -->
  <g transform="translate(0, 4)">
    <path d="M264 374 C264 332 294 314 322 314 C350 314 380 332 380 374 Z" fill="url(#thomasGrad)"/>
    <circle cx="322" cy="276" r="30" fill="#FDE6D8" stroke="url(#thomasGrad)" stroke-width="6"/>
    <!-- Sourire doux Thomas -->
    <circle cx="313" cy="273" r="3.2" fill="#0C4A6E"/>
    <circle cx="331" cy="273" r="3.2" fill="#0C4A6E"/>
    <path d="M314 284 Q322 291 330 284" fill="none" stroke="#0C4A6E" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Émile (au centre devant ses parents) -->
  <g filter="url(#cardShadow)" transform="translate(0, 6)">
    <path d="M204 386 C204 350 228 334 256 334 C284 334 308 350 308 386 Z" fill="url(#emileGrad)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="256" cy="302" r="26" fill="#FFF1E6" stroke="url(#emileGrad)" stroke-width="6"/>
    <!-- Petite mèche de bébé Émile -->
    <path d="M252 276 Q258 265 266 273" fill="none" stroke="#D97706" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Visage souriant Émile -->
    <circle cx="248" cy="300" r="3" fill="#78350F"/>
    <circle cx="264" cy="300" r="3" fill="#78350F"/>
    <circle cx="242" cy="306" r="4" fill="#F43F5E" opacity="0.35"/>
    <circle cx="270" cy="306" r="4" fill="#F43F5E" opacity="0.35"/>
    <path d="M249 309 Q256 316 263 309" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pastilles agenda en bas de la maison (Marie • Émile & Tata • Thomas) -->
  <rect x="122" y="400" width="268" height="22" rx="11" fill="#FDF4EC"/>
  <circle cx="158" cy="411" r="6" fill="#DB2777"/>
  <circle cx="223" cy="411" r="6" fill="#D97706"/>
  <circle cx="289" cy="411" r="6" fill="#0284C7"/>
  <circle cx="354" cy="411" r="6" fill="#16A34A"/>
</svg>
